rules:
  - id: owasp-ruby-sql-injection
    message: "Possible SQL injection via string concatenation"
    severity: ERROR
    languages: [ruby]
    patterns:
      - pattern-either:
          - pattern: |
              $DB.execute($QUERY + $X)
          - pattern: |
              $DB.query($QUERY + $X)

  - id: owasp-ruby-command-exec
    message: "Command execution with dynamic input"
    severity: ERROR
    languages: [ruby]
    patterns:
      - pattern-either:
          - pattern: |
              system($CMD)
          - pattern: |
              `#{ $CMD }`

  - id: owasp-ruby-hardcoded-secret
    message: "Possible hardcoded secret or credential"
    severity: WARNING
    languages: [ruby]
    patterns:
      - pattern-either:
          - pattern: |
              $VAR = "SECRET"
          - pattern: |
              $VAR = "PASSWORD"
          - pattern: |
              $VAR = "API_KEY"
          - pattern: |
              $VAR = "TOKEN"
